name: Build Mira AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create Android project from Mira HTML
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          node -e "let p=require('./package.json');p.name='mira-ai';p.scripts={...(p.scripts||{}),build:'cap sync android'};require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mehtab.miraai",
            "appName": "Mira AI",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Mira APK
        uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
