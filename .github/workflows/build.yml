name: Build Mira AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project from Mira HTML
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          node -e "let p=require('./package.json');p.name='mira-ai';p.scripts={...(p.scripts||{}),build:'cap sync android'};require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mehtab.miraai",
            "appName": "Mira AI",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Align Kotlin standard library versions
        run: |
          cat > kotlin-resolution.init.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name.startsWith('kotlin-stdlib')) {
                  details.useVersion '1.8.22'
                }
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -I ../kotlin-resolution.init.gradle assembleDebug
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload Mira APK
        uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  
